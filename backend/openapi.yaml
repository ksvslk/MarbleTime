openapi: 3.1.0
info:
  title: MarbleTime API
  version: 0.1.0
  description: |
    Kids earn TV time with real-life jobs (chores, approved by a parent). Each kid has a daily budget from health
    guidance (docs/08-evidence-based-design.md): a free base every day and a ceiling. Approved jobs fill the jar up
    to the ceiling; a job approved when the jar is full earns a new character instead of time.
    Two callers:
      - the parent web app, signed in with Cognito (`Authorization: Bearer <access token>`);
      - a paired TV, with the device token it got when it was paired (`Authorization: Device <token>`).
    Words: the API says "children", "chores" and "parent"; the apps say "kids", "jobs" and "grown-ups".
    Times are epoch milliseconds. Minutes are whole multiples of 10 (one marble = 10 minutes: one short TV
    session, after Estonia's TAI 2026 advice of sessions of at most 10–15 minutes for ages 3–5).
    Errors are `{"error": {"code": "...", "message": "..."}}` with a 4xx/5xx status.
    Design: docs/03-architecture.md §4.1 (earning), §4.3 (pairing), §6 (ledger), §7 (data model), §8.

servers:
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com
    variables:
      apiId: {default: example}
  - url: http://localhost:8787
    description: local dev server (backend/src/dev-server.ts); `Bearer dev-<name>` signs a parent in

security:
  - parent: []

x-realtime:
  description: |
    Live updates over WebSocket (API Gateway WebSocket API; its address is the stack output RealtimeUrl and
    `realtimeUrl` in the parent app's /config.json). Clients connect with one query parameter:
      TV:     wss://…?device=<device token>
      parent: wss://…?token=<Cognito access or ID token>
    and are tied to their family. Whenever anything in the family changes (claims, decisions, balances,
    adjustments, settings, children, chores, devices, characters), the server sends every open connection
    of that family `{"type": "changed"}` within a second, and clients fetch what they show
    (TV: GET /device/state with its ETag; parent app: the screen's data). Clients reconnect with backoff and
    keep polling slowly (TV every 15 s, parent app every 30 s) in case the connection drops. Messages from
    clients are ignored except `{"type": "ping"}`, answered with `{"type": "pong"}`.

paths:
  # ---------- Parent: family ----------
  /me:
    get:
      summary: Who is signed in, and their family (null until onboarding is done)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
    patch:
      summary: The parent's name as kids see it on the TV when this parent approves a job ("– Dad"). Works once signed in, before or after the family exists.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 24}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
  /family:
    post:
      summary: Create the family (onboarding). The caller becomes its first parent.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FamilyCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Family'}}}}
        '409': {$ref: '#/components/responses/Error'}
    get:
      summary: Everything the parent app shows
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/FamilyBundle'}}}}
    patch:
      summary: Name, language, TV settings, grown-ups PIN
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FamilyPatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Family'}}}}

  # ---------- Parent: children ----------
  /children:
    post:
      summary: Add a child
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChildInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Child'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /children/{childId}:
    parameters: [{$ref: '#/components/parameters/childId'}]
    patch:
      summary: Edit a child (name, avatar, age, daily budget)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChildPatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Child'}}}}
    delete:
      summary: Remove a child and everything about them
      responses: {'204': {description: Deleted}}
  /children/{childId}/adjust:
    parameters: [{$ref: '#/components/parameters/childId'}]
    post:
      summary: Bonus (+) or taken-away (−) minutes, with a reason
      description: |
        Minus only takes earned minutes and never goes below an empty jar: the entry records what was
        actually taken. With nothing earned, it's 409 `empty_jar`. The TV shows both kinds with the reason
        (a bonus as a celebration, minus as a calm line on the child's board).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deltaMin, reason]
              properties:
                id: {type: string, description: client UUID; repeats are ignored}
                deltaMin: {type: integer, minimum: -120, maximum: 120, multipleOf: 10, not: {const: 0}, description: 'whole marbles (10 min each)'}
                reason: {type: string, maxLength: 80}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Balance'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /children/{childId}/ledger:
    parameters: [{$ref: '#/components/parameters/childId'}]
    get:
      summary: History, newest first
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [entries], properties: {entries: {type: array, items: {$ref: '#/components/schemas/LedgerEntry'}}}}
  /children/{childId}/characters:
    parameters: [{$ref: '#/components/parameters/childId'}]
    get:
      summary: The kid's characters, newest first (drawing, ready, or needs_help)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, required: [characters], properties: {characters: {type: array, items: {$ref: '#/components/schemas/Character'}}}}}}}
    post:
      summary: Make a new character from the kid's own words (uses one character token)
      description: |
        The art director turns the words into a character card first (a few seconds, in this request): brands
        and known characters are never copied, scary things become friendly, mild cartoon props are fine
        (docs/08, Decisions 5). Drawing and checking then run in the background (median ~25 s); the family's
        clients get `changed` when the character is ready. No ready-made character is ever swapped in.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [description], properties: {description: {type: string, minLength: 1, maxLength: 200, description: 'the kid''s words, typed or from /speech-to-text'}}}}}
      responses:
        '202': {description: Accepted; status drawing, content: {application/json: {schema: {$ref: '#/components/schemas/Character'}}}}
        '409': {description: 'no_tokens: the kid has no character token', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'idea_not_ok: nothing safe and original could be made from these words; message is a kind sentence (in the family''s language) to read to the kid; the token is kept', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: 'too_many: too many tries for now; the token is kept', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: 'unavailable: the drawing models can''t be reached right now; the token is kept, try later', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /children/{childId}/puzzles:
    parameters: [{$ref: '#/components/parameters/childId'}]
    get:
      summary: How a kid's puzzle rounds went, newest first (the last 30 rounds)
      description: |
        Each finished round as the TV reported it: when, and every question with its subject, level and whether
        the kid got it right. The same history tells the writer how to pitch the
        kid's next session (harder after right answers, easier after misses) when the difficulty follows the kid.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rounds]
                properties:
                  rounds: {type: array, items: {$ref: '#/components/schemas/PuzzleRound'}}
        '404': {$ref: '#/components/responses/Error'}
  /children/{childId}/characters/{characterId}:
    parameters: [{$ref: '#/components/parameters/childId'}, {$ref: '#/components/parameters/characterId'}]
    delete:
      summary: A grown-up removes a character, in any state
      description: |
        A drawing in progress is dropped. The token of a drawing or ready character goes back to the kid, who can make
        another (a needs_help try already gave it back). Kids never lose an earned character to a removal.
      responses:
        '204': {description: Removed}
  /speech-to-text:
    post:
      summary: The kid's spoken idea from the parent's phone → text in the family's language (Gemini listens). The audio is not stored or logged.
      description: |
        The parent app records, then converts in the browser to a 16 kHz mono 16-bit PCM WAV (at most 15 s). The backend
        checks the header and asks Gemini for an exact transcript in the family's language (en, et, de or es; words in
        another language are kept as said). The body arrives base64-encoded through API Gateway: decode it to bytes,
        never to text.
      requestBody:
        required: true
        content:
          audio/wav: {schema: {type: string, format: binary}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, description: 'empty when nothing was heard'}}}}}}
        '400': {description: 'bad_audio: not a 16 kHz mono 16-bit PCM WAV', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {description: 'unavailable: the speech model can''t be reached right now', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /children/{childId}/handoff:
    parameters: [{$ref: '#/components/parameters/childId'}]
    get:
      summary: Minutes to add in Amazon Kids (pending earned minutes minus outstanding penalties)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Handoff'}}}}
    post:
      summary: Mark hand-off entries done (added in Amazon Kids) or skipped (settled another way)
      description: |
        Either way the minutes are settled and leave the kid's jar at the family's next local midnight: until then they
        are today's TV (the daily maximum holds and the TV's marbles stay). After that midnight, the kid's first read
        or write takes them out of balanceSec with a HANDOFF ledger entry, so the jar has room for new marbles. Earned
        minutes otherwise wait in the jar until used (strict mode) or handed off; nothing else empties it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryIds, status]
              properties:
                entryIds: {type: array, items: {type: string}, minItems: 1, maxItems: 200}
                status: {type: string, enum: [DONE, SKIPPED]}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Handoff'}}}}

  # ---------- Parent: chores ----------
  /chores:
    post:
      summary: Add a job. Without `icon`, the server picks one from the job-icon set by the title.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChoreInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Chore'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /chores/{choreId}:
    parameters: [{$ref: '#/components/parameters/choreId'}]
    patch:
      summary: Edit a job
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChorePatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Chore'}}}}
    delete:
      summary: Remove a job (its history stays)
      responses: {'204': {description: Deleted}}

  # ---------- Parent: claims ----------
  /claims:
    get:
      summary: Claims, newest first (approvals inbox = status=waiting)
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ClaimStatus'}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [claims], properties: {claims: {type: array, items: {$ref: '#/components/schemas/Claim'}}}}
  /claims/{claimId}/approve:
    parameters: [{$ref: '#/components/parameters/claimId'}]
    post:
      summary: Yes. Gives what the claim was promised (once; repeats return the same claim).
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /claims/{claimId}/reject:
    parameters: [{$ref: '#/components/parameters/claimId'}]
    post:
      summary: Not yet. No minutes; the job is back on the TV board, with the reason if one was given.
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/NotYet'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}
        '409': {$ref: '#/components/responses/Error'}

  # ---------- Parent: notifications ----------
  /push/key:
    get:
      summary: The Web Push (VAPID) public key the parent app subscribes with
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [publicKey], properties: {publicKey: {type: string, description: base64url}}}
  /push/decisions:
    post:
      summary: A grown-up answers a claim from its notification ("Yes" / "Not yet"), with the pass the notification carried
      description: |
        Every claim notification carries a single-use pass for the browser it was sent to (`data.token`, good for
        a day), so the service worker can answer without the app being open or signed in. The answer counts as
        that parent's, exactly like POST /claims/{claimId}/approve or /reject. A used, expired or unknown pass
        is 404: the grown-up opens the app instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, yes]
              properties:
                token: {type: string, description: 'the pass from the notification'}
                yes: {type: boolean}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /push/subscriptions:
    post:
      summary: This browser wants notifications (a kid says "I did it!"). Repeats with the same endpoint update it.
      description: |
        The server sends a Web Push to every subscribed browser of the family's parents when a claim is made:
        title "<child>: <job> is done", body what a yes gives ("+10 min", "a new character"), actions "yes" and
        "not_yet" (answered with POST /push/decisions), data {url: "/", claimId, token}. A tap on the notification
        itself opens `url`, the page where jobs are approved.
        Subscriptions the push service reports gone (404/410) are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: {type: string, maxLength: 1000}
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: {type: string}
                    auth: {type: string}
      responses:
        '201': {description: Saved}
        '400': {$ref: '#/components/responses/Error'}
    delete:
      summary: Stop notifications for this browser
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [endpoint], properties: {endpoint: {type: string}}}
      responses: {'204': {description: Deleted (or already gone)}}

  # ---------- Parent: devices and pairing ----------
  /pairings/{code}/confirm:
    parameters: [{$ref: '#/components/parameters/code'}]
    post:
      summary: The parent scanned the TV's QR code and named the TV. Creates the device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 40}
                mode: {$ref: '#/components/schemas/DeviceMode'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /devices:
    get:
      summary: Paired TVs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [devices], properties: {devices: {type: array, items: {$ref: '#/components/schemas/Device'}}}}
  /devices/{deviceId}:
    parameters: [{$ref: '#/components/parameters/deviceId'}]
    patch:
      summary: Rename a TV or change its mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 40}
                mode: {$ref: '#/components/schemas/DeviceMode'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
    delete:
      summary: Unpair a TV (its token stops working)
      responses: {'204': {description: Deleted}}

  # ---------- TV: pairing (no auth: the short-lived code is the secret) ----------
  /pairings:
    post:
      summary: A TV asks to be paired. Shows the code and a QR code of `pairUrl`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: {$ref: '#/components/schemas/Platform'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, pairUrl]
                properties:
                  code: {type: string, description: '6 characters, no look-alikes (A–Z without I, O; 2–9)', example: K7QX4M}
                  expiresAt: {type: integer, description: 10 minutes from now}
                  pairUrl: {type: string, description: 'parent app link, e.g. https://…/pair/K7QX4M'}
  /pairings/{code}:
    parameters: [{$ref: '#/components/parameters/code'}]
    get:
      summary: The TV polls (every 2 s) until a parent confirms. The token is handed out once.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [waiting, paired, expired]}
                  deviceToken: {type: string, description: 'only once, with status paired; 256-bit random, stored hashed'}
                  deviceId: {type: string}
        '404': {$ref: '#/components/responses/Error'}

  # ---------- TV (device token) ----------
  /device/state:
    get:
      summary: Everything the TV needs (the poll target; ~3 s on screen). Supports If-None-Match → 304; the ETag covers everything except serverTime.
      security: [{device: []}]
      responses:
        '200': {description: OK, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceState'}}}}
        '304': {description: Not changed}
        '401': {$ref: '#/components/responses/Error'}
  /device/claims:
    post:
      summary: A child says "I did it!". Idempotent on `id` (the TV's outbox may resend).
      security: [{device: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, childId, choreId, at]
              properties:
                id: {type: string, description: client UUID}
                childId: {type: string}
                choreId: {type: string}
                at: {type: integer}
      responses:
        '200': {description: OK (already had it), content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}
        '409': {description: 'Already done today (or a one-off job already approved)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /device/puzzles/session:
    get:
      summary: A kid's next puzzle session, in the family's language
      description: |
        The session written for this kid if one is ready (the same until they finish it), else one from the bank,
        while their written one is started in the background (where a model can be reached). The subjects take
        turns, each question at the kid's level in its subject; from the bank, new questions come before ones the
        kid has seen. `spare` is one more, a level easier, asked only after a miss on the last question, so a
        session ends on a success. `questions` is empty where the language has no puzzles at all.
        A kid may play more than one session a day; only the day's first earns a star, and the time spent in
        puzzles counts as TV time (the TV reports it with POST /device/usage).
      security: [{device: []}]
      parameters: [{name: childId, in: query, required: true, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [questions]
                properties:
                  questions: {type: array, items: {$ref: '#/components/schemas/Puzzle'}}
                  spare: {$ref: '#/components/schemas/Puzzle'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'Puzzles are turned off for this kid', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /device/puzzles/results:
    post:
      summary: A kid finished a puzzle session on the TV. Idempotent on `id` (the TV's outbox may resend).
      description: |
        The first session finished today earns one star (Puzzles in the Child schema); the kid's levels follow the
        answers either way. The answer is the kid as of now.
      security: [{device: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, childId]
              properties:
                id: {type: string, description: client UUID}
                childId: {type: string}
                answers:
                  type: array
                  maxItems: 30
                  description: the kid's first answer to each puzzle of the session (their levels follow these)
                  items:
                    type: object
                    required: [id, right]
                    properties:
                      id: {type: string}
                      right: {type: boolean}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Child'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'Puzzles are turned off for this kid', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /device/usage:
    post:
      summary: The TV counted watched time for a kid. Idempotent on `id` (the TV's outbox may resend).
      description: |
        Takes `seconds` out of the kid's jar: today's base first, then earned time (a USAGE ledger entry). Never
        below an empty jar: what the jar didn't hold is not counted. Every TV reports the time a kid spends in
        MarbleTime's own screen time (puzzles, playing with their characters); a TV in strict mode also reports
        about once a minute while a metered app is in front. So every screen shows the time left.
      security: [{device: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, childId, seconds]
              properties:
                id: {type: string, description: client UUID}
                childId: {type: string}
                seconds: {type: integer, minimum: 1, maximum: 3600}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Child'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /device/claims/{claimId}:
    parameters: [{$ref: '#/components/parameters/claimId'}]
    delete:
      summary: '"Oops!": take back a waiting claim'
      security: [{device: []}]
      responses:
        '204': {description: Deleted (or already gone)}
        '409': {$ref: '#/components/responses/Error'}
  /device/claims/{claimId}/decide:
    parameters: [{$ref: '#/components/parameters/claimId'}]
    post:
      summary: A grown-up decides on the TV, with the family PIN (5 wrong PINs a minute per TV → 429)
      security: [{device: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yes, pin]
              properties:
                yes: {type: boolean}
                pin: {type: string, pattern: '^[0-9]{4}$'}
                reason: {$ref: '#/components/schemas/NotYetReason'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Claim'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /device/children/{childId}/characters:
    parameters: [{$ref: '#/components/parameters/childId'}]
    post:
      summary: A kid describes their new character on the TV (uses one character token)
      description: |
        The same as POST /children/{childId}/characters, from the TV: the words come from the TV's keyboard, where
        the remote's microphone button dictates (Fire TV's own keyboard) or the kid types. The token is the kid's
        own earned reward and the art director screens every idea, so no grown-up's PIN is asked.
      security: [{device: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [description], properties: {description: {type: string, minLength: 1, maxLength: 200}}}}}
      responses:
        '202': {description: Accepted; status drawing, content: {application/json: {schema: {$ref: '#/components/schemas/Character'}}}}
        '409': {description: 'no_tokens: the kid has no character token', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'idea_not_ok: message is a kind sentence (in the family''s language) to show and read to the kid; the token is kept', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: 'too_many: too many tries for now; the token is kept', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: 'unavailable: the drawing models can''t be reached right now; the token is kept, try later', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /device/characters/{characterId}:
    parameters: [{$ref: '#/components/parameters/characterId'}]
    get:
      summary: A ready character's art for the TV to draw and animate (never changes once ready; cache forever)
      security: [{device: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CharacterArt'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /device/speech:
    post:
      summary: A short line spoken by a character, or by the narrator (read-aloud), in the family's language (Gemini voices), with the mouth's movement
      description: |
        The TV fills its own templates ("You did it, Mia!", in en, et, de or es) and asks for the audio. Gemini-TTS
        speaks it in character: the character's voice, with a speaking style the backend composes from fixed parts
        (what the character is, its mood and its voiceStyle; never AI-written words). The audio is loudness-normalised
        (about -16 LUFS, like the read-aloud) and the same text, character and language always give the same audio
        (cached), so a line is made once. Only short lines; rate-limited per TV.

        Without `characterId` the **narrator** says it: the TV's read-aloud voice (the same voice and style as its
        recorded clips, scripts/make-voices.py), for the family's own words that can't be recorded ahead (kids'
        names, job titles, "Feed the cat: done! – Dad", a bonus reason).
      security: [{device: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text, lang], properties: {text: {type: string, minLength: 1, maxLength: 160}, lang: {$ref: '#/components/schemas/Lang'}, characterId: {type: string, description: 'a ready character of this TV''s family, whose voice, mood and voiceStyle shape the speech; left out = the narrator'}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Speech'}}}}
        '404': {description: 'not_found: no such ready character in this family', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: 'too_many: more than 60 new lines this hour on this TV (cached lines don''t count)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: 'unavailable: speech can''t be made right now; the TV stays silent. A new line not ready in the request''s 24 s goes on in the background: asked again later, it comes from the cache', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /device/settings:
    post:
      summary: A grown-up changes the family's TV settings on the TV, with the family PIN (same PIN limit as decisions)
      description: The phone app sees the change on its next load; the last change wins, wherever it was made.
      security: [{device: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: {type: string, pattern: '^[0-9]{4}$'}
                lang: {$ref: '#/components/schemas/Lang'}
                caps: {type: boolean}
                voice: {type: boolean}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Family'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /device/heartbeat:
    post:
      summary: The TV is alive (shown as "last seen" in the parent app)
      security: [{device: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {appVersion: {type: string}}}
      responses: {'204': {description: OK}}

components:
  securitySchemes:
    parent:
      type: http
      scheme: bearer
      description: Cognito access token (local dev server - `dev-<name>`)
    device:
      type: apiKey
      in: header
      name: Authorization
      description: '`Device <token>` from pairing'

  parameters:
    childId: {name: childId, in: path, required: true, schema: {type: string}}
    choreId: {name: choreId, in: path, required: true, schema: {type: string}}
    claimId: {name: claimId, in: path, required: true, schema: {type: string}}
    deviceId: {name: deviceId, in: path, required: true, schema: {type: string}}
    characterId: {name: characterId, in: path, required: true, schema: {type: string}}
    code: {name: code, in: path, required: true, schema: {type: string, pattern: '^[A-HJ-NP-Z2-9]{6}$'}}

  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: not_found}
            message: {type: string}

    Lang: {type: string, enum: [en, et, de, es]}
    Color: {type: string, enum: [peach, mint, sky, lilac, gold], description: card and avatar colours from the TV design}
    Avatar: {type: string, enum: [bear, bunny]}
    Platform: {type: string, enum: [fireos, vega, web]}
    DeviceMode: {type: string, enum: [amazon_kids, strict, api_mock], default: amazon_kids}
    ClaimStatus: {type: string, enum: [waiting, approved, rejected]}
    JobIcon:
      type: string
      description: JOB_ICONS in tv/packages/shared/src/marble/data.ts (with a hint for each)
      enum: [toys, cat, tooth, moon, broom, bed, shirt, laundry, trash, recycle, table, cook, wash, shower, bath, dog,
             fish, bird, rabbit, plant, leaf, snow, book, pencil, backpack, music, paint, puzzle, bike, shoes, car,
             shopping, spray, sofa, lamp, baby, heart, water, fruit, veggie, sun, mail, star]

    Me:
      type: object
      required: [parent, family]
      properties:
        parent: {type: object, required: [id], properties: {id: {type: string}, email: {type: string}, name: {type: string, maxLength: 24, description: 'as kids see it; unset until the parent picks one'}}}
        family: {oneOf: [{$ref: '#/components/schemas/Family'}, {type: 'null'}]}

    Family:
      type: object
      required: [id, name, lang, timezone, caps, voice, hasPin, createdAt]
      properties:
        id: {type: string}
        name: {type: string, maxLength: 40}
        lang: {$ref: '#/components/schemas/Lang'}
        timezone: {type: string, example: Europe/Tallinn, description: 'IANA zone; "today" (daily jobs, the daily budget) is this zone''s day'}
        caps: {type: boolean, description: kid text in CAPITAL LETTERS on the TV}
        voice: {type: boolean, description: read aloud on the TV}
        hasPin: {type: boolean}
        createdAt: {type: integer}
    FamilyCreate:
      type: object
      required: [name, lang, timezone, pin]
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        lang: {$ref: '#/components/schemas/Lang'}
        timezone: {type: string}
        pin: {type: string, pattern: '^[0-9]{4}$', description: grown-ups PIN on the TV}
    FamilyPatch:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        lang: {$ref: '#/components/schemas/Lang'}
        timezone: {type: string}
        caps: {type: boolean}
        voice: {type: boolean}
        pin: {type: string, pattern: '^[0-9]{4}$'}
    FamilyBundle:
      type: object
      required: [family, children, chores, devices]
      properties:
        family: {$ref: '#/components/schemas/Family'}
        children: {type: array, items: {$ref: '#/components/schemas/Child'}}
        chores: {type: array, items: {$ref: '#/components/schemas/Chore'}}
        devices: {type: array, items: {$ref: '#/components/schemas/Device'}}

    Child:
      type: object
      required: [id, name, avatar, color, age, balanceSec, dailyBaseMin, dailyMaxMin, characterTokens, usedTodaySec, leftTodaySec, puzzles]
      properties:
        id: {type: string}
        name: {type: string, maxLength: 24}
        avatar: {$ref: '#/components/schemas/Avatar'}
        color: {$ref: '#/components/schemas/Color'}
        age: {type: integer, minimum: 3, maximum: 12}
        balanceSec: {type: integer, minimum: 0, description: earned minutes × 60 not yet used or handed off (never below 0)}
        dailyBaseMin: {$ref: '#/components/schemas/DailyBase'}
        dailyMaxMin: {$ref: '#/components/schemas/DailyMax'}
        characterTokens: {type: integer, minimum: 0, description: 'new characters earned (jobs approved while the jar was full) and not yet made'}
        usedTodaySec: {type: integer, minimum: 0, description: 'TV watched today (the family''s local day), as the TVs reported it (POST /device/usage)'}
        puzzles: {$ref: '#/components/schemas/Puzzles'}
        bedtime: {$ref: '#/components/schemas/Bedtime'}
        leftTodaySec:
          type: integer
          minimum: 0
          description: |
            The jar: TV time left today = what is left of today's base + balanceSec. Watching takes today's base
            first, then earned time. What can still be earned today is dailyMaxMin × 60 − leftTodaySec − usedTodaySec.
    Puzzles:
      type: object
      required: [on, stars, starsNeeded, doneToday, levels, level, levelAges]
      description: |
        Puzzles on the TV: short questions written by a model, checked (format by code, the answer by blind solvers)
        and kept as a bank per language, so playing never waits on a model; a kid's next round is also written for
        them in the background. They never earn TV time (docs/08 §3.1): every finished round earns one star, whatever
        the score, and starsNeeded stars earn a new character (characterTokens + 1), after which stars start again.
      properties:
        on: {type: boolean, description: 'a grown-up can turn puzzles off for a kid (ChildPatch.puzzles)'}
        stars: {type: integer, minimum: 0, description: 'stars toward the next character (0 … starsNeeded − 1)'}
        starsNeeded: {type: integer, minimum: 1}
        doneToday: {type: boolean, description: 'a round was finished today (the family''s local day); more rounds may follow, each earns a star'}
        levels:
          type: object
          additionalProperties: {type: integer, minimum: 1, maximum: 9}
          description: 'the kid''s level per subject, as their answers placed them (a subject not listed starts from the age''s level)'
        level: {type: integer, minimum: 0, maximum: 4, description: 'the difficulty a grown-up chose for every subject (ChildPatch.puzzleLevel, 1 easiest); 0: it follows the kid''s answers (levels)'}
        levelAges: {type: array, items: {type: string}, description: 'the ages each level is written for, level 1 first ("4–5", "6", "7–8", "9–10")'}
    PuzzleRound:
      type: object
      required: [at, right, total, answers]
      description: One finished puzzle round.
      properties:
        at: {type: integer, description: when it was finished (ms since 1970)}
        right: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        answers:
          type: array
          description: the questions in the order they were asked
          items:
            type: object
            required: [subject, level, right, prompt]
            properties:
              subject: {type: string, description: 'logic, numbers, words or world'}
              level: {type: integer, minimum: 1, maximum: 4}
              right: {type: boolean}
              prompt: {type: string, description: the question as it was shown}
    Puzzle:
      type: object
      required: [id, subject, level, prompt, picture, choices, answer, reason]
      description: One puzzle in the fixed shape every puzzle has (a question, an optional row of pictures, three answers).
      properties:
        id: {type: string}
        subject: {type: string, description: 'logic, numbers, words, world, … (a new subject needs no client change)'}
        level: {type: integer, minimum: 1}
        prompt: {type: string, description: the question, shown and read aloud}
        picture: {type: array, items: {type: string}, description: 'emoji the question is about, shown in a row (may be empty)'}
        choices:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            description: a word (or number, or short phrase) or one emoji; all three of a puzzle are the same kind
            properties:
              text: {type: string}
              emoji: {type: string}
        answer: {type: integer, minimum: 0, maximum: 2, description: 'the place of the right answer (the TV marks it, so a session needs no network)'}
        reason: {type: string, description: 'one line shown and read after the kid answers: why the right answer is right'}
    Bedtime:
      type: object
      required: [from, to]
      description: |
        When this kid's TV time ends for the night, in the family's local time ("19:30" to "07:00"; it runs past
        midnight when `to` is earlier than `from`). On a TV in strict mode a video app closes for this kid when it
        begins, whatever is left in the jar, and the kid can't be picked to watch until it ends; a grown-up can
        allow 30 more minutes with the PIN on the TV. In Amazon Kids mode the TV can't enforce it (Amazon Kids has
        its own bedtime). `from` and `to` differ. Absent: no bedtime.
      properties:
        from: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        to: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    DailyBase:
      type: integer
      minimum: 0
      maximum: 120
      multipleOf: 10
      description: |
        Screen time every day, before anything is earned, so TV isn't only a prize: an allowance, the parenting
        practice linked to less screen time (docs/08 §1.3). Default: half of dailyMaxMin rounded up to the next 10
        (60 → 30, 90 → 50, 120 → 60), so a third to a half of the jar is earnable (docs/08 §1.5). Never above dailyMaxMin.
        Not in the ledger and not handed off: in Amazon Kids mode the parent sets the same daily limit there; in
        strict mode the TV starts each day with it.
    DailyMax:
      type: integer
      minimum: 10
      maximum: 120
      multipleOf: 10
      description: |
        The most TV a day for this kid, everything included: the jar's size. From national guidance (docs/08 §1.1):
        default 60 under age 7 (WHO 2019; Estonia TAI 2025 "kuni 60 minutit"), 90 from age 7 (TAI 2025 "kuni kahe
        tunnini"; Norway 60–90); never above 60 under 7 or 120 from 7. Changing the age clamps it, and so does the
        server for values above the limit (no error).
    ChildInput:
      type: object
      required: [name, avatar, color, age]
      properties:
        puzzles: {type: boolean, description: 'puzzles on the TV for this kid (default on)'}
        puzzleLevel: {type: integer, minimum: 0, maximum: 4, description: 'the puzzles'' difficulty for every subject, chosen by a grown-up (1 easiest; Puzzles.levelAges says who each is written for). 0, the default: it follows the kid''s answers. A change takes effect with the kid''s next session.'}
        name: {type: string, minLength: 1, maxLength: 24}
        avatar: {$ref: '#/components/schemas/Avatar'}
        color: {$ref: '#/components/schemas/Color'}
        age: {type: integer, minimum: 3, maximum: 12}
        dailyBaseMin: {$ref: '#/components/schemas/DailyBase'}
        dailyMaxMin: {$ref: '#/components/schemas/DailyMax'}
    ChildPatch:
      type: object
      properties:
        bedtime: {oneOf: [{$ref: '#/components/schemas/Bedtime'}, {type: 'null'}], description: 'null removes it'}
        puzzles: {type: boolean, description: 'puzzles on the TV for this kid (default on)'}
        puzzleLevel: {type: integer, minimum: 0, maximum: 4, description: 'the puzzles'' difficulty for every subject, chosen by a grown-up (1 easiest; Puzzles.levelAges says who each is written for). 0, the default: it follows the kid''s answers. A change takes effect with the kid''s next session.'}
        name: {type: string, minLength: 1, maxLength: 24}
        avatar: {$ref: '#/components/schemas/Avatar'}
        color: {$ref: '#/components/schemas/Color'}
        age: {type: integer, minimum: 3, maximum: 12}
        dailyBaseMin: {$ref: '#/components/schemas/DailyBase'}
        dailyMaxMin: {$ref: '#/components/schemas/DailyMax'}

    Repeat:
      description: How often a job can be done. Every kind can be done at most once per day per child.
      oneOf:
        - {type: object, required: [kind], properties: {kind: {const: daily}}}
        - {type: object, required: [kind, days], properties: {kind: {const: weekdays}, days: {type: array, items: {type: integer, minimum: 1, maximum: 7}, minItems: 1, uniqueItems: true, description: 'ISO weekdays, 1 = Monday'}}}
        - {type: object, required: [kind], properties: {kind: {const: once}}, description: 'gone once approved'}
    Chore:
      type: object
      required: [id, title, icon, color, minutes, routine, repeat, childIds, createdAt]
      properties:
        id: {type: string}
        title: {type: string, maxLength: 60}
        icon: {$ref: '#/components/schemas/JobIcon'}
        color: {$ref: '#/components/schemas/Color'}
        minutes: {type: integer, minimum: 10, maximum: 30, multipleOf: 10, description: '1–3 marbles: small, frequent payoffs (docs/08 §2)'}
        routine: {type: boolean, default: false, description: 'no effect since Oct 13 2026: every job gives its minutes (docs/08, Decisions). Always false in answers; accepted and ignored in requests.'}
        repeat: {$ref: '#/components/schemas/Repeat'}
        childIds: {type: array, items: {type: string}, minItems: 1}
        createdAt: {type: integer}
    ChoreInput:
      type: object
      required: [title, minutes, childIds]
      properties:
        title: {type: string, minLength: 1, maxLength: 60}
        icon: {$ref: '#/components/schemas/JobIcon'}
        color: {$ref: '#/components/schemas/Color'}
        minutes: {type: integer, minimum: 10, maximum: 30, multipleOf: 10, description: '1–3 marbles: small, frequent payoffs (docs/08 §2)'}
        routine: {type: boolean, description: 'no effect since Oct 13 2026: every job gives its minutes (docs/08, Decisions); accepted and ignored'}
        repeat: {$ref: '#/components/schemas/Repeat'}
        childIds: {type: array, items: {type: string}, minItems: 1}
    ChorePatch:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 60}
        icon: {$ref: '#/components/schemas/JobIcon'}
        color: {$ref: '#/components/schemas/Color'}
        minutes: {type: integer, minimum: 10, maximum: 30, multipleOf: 10, description: '1–3 marbles: small, frequent payoffs (docs/08 §2)'}
        routine: {type: boolean, description: 'no effect since Oct 13 2026: every job gives its minutes; accepted and ignored'}
        repeat: {$ref: '#/components/schemas/Repeat'}
        childIds: {type: array, items: {type: string}, minItems: 1}

    Claim:
      type: object
      required: [id, childId, choreId, status, minutes, createdAt]
      properties:
        id: {type: string}
        childId: {type: string}
        choreId: {type: string}
        choreTitle: {type: string, description: copied at claim time, so history survives edits}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        minutes: {type: integer, description: the job's minutes at claim time}
        createdAt: {type: integer}
        decidedAt: {type: integer}
        decidedBy: {type: string, enum: [parent, tv]}
        approverName: {type: string, description: 'the approving parent''s name as kids see it ("– Dad"); absent when approved on the TV or unset'}
        promised:
          type: object
          required: [reward, minutes]
          description: |
            What the job card showed when the kid said "I did it!", and so what a yes gives: worked out at claim
            time from the room left in today's jar, less what the kid's other waiting claims were promised.
            Absent on claims made before promises existed (their reward is worked out at approval).
          properties:
            reward: {$ref: '#/components/schemas/RewardKind'}
            minutes: {type: integer, minimum: 0, description: 'minutes into the jar (see RewardKind)'}
        reward: {$ref: '#/components/schemas/RewardKind'}
        minutesCredited: {type: integer, minimum: 0, description: 'set on approval: minutes that went into the jar (≤ minutes; 0 for praise, and for a character earned with a full jar)'}
        notYetReason: {$ref: '#/components/schemas/NotYetReason'}
    RewardKind:
      type: string
      enum: [marbles, character, praise]
      description: |
        marbles = the job's minutes go into the jar (they all fit under dailyMaxMin);
        character = the job didn't fit: whatever part fitted goes into the jar (0 when it was already full), and
        the kid earns a new character for the rest (characterTokens + 1), so no marble is dropped unseen;
        praise = a thank-you without a marble: only on claims from before Oct 13 2026, when a job could be marked routine.
    NotYetReason:
      type: string
      enum: [not_finished, together, later]
      description: |
        Why a grown-up said "not yet", so the kid knows what to do next (the TV shows and reads it):
        not_finished = there's a bit left to do; together = let's do it together; later = I'll look later, ask again.
    NotYet:
      type: object
      properties:
        reason: {$ref: '#/components/schemas/NotYetReason'}

    LedgerEntry:
      type: object
      required: [id, childId, deltaSec, type, reason, createdAt]
      properties:
        id: {type: string}
        childId: {type: string}
        deltaSec: {type: integer}
        type: {type: string, enum: [ALLOWANCE, CHORE, GAME, BONUS, PENALTY, USAGE, ADJUST, HANDOFF], description: 'HANDOFF: minutes settled by the hand-off, which leave the jar at the family''s next local midnight (createdBy "system", dated at that midnight). GAME only in history from before Oct 7, 2026 (brain games were removed)'}
        reason: {type: string}
        refId: {type: string, description: 'claim id (old GAME entries: game result id)'}
        createdBy: {type: string, description: '"parent:<id>", "tv:<deviceId>" or "system"'}
        createdAt: {type: integer}
        handoff: {type: string, enum: [PENDING, DONE, SKIPPED], description: 'Amazon Kids hand-off, positive entries only'}
        baseSec: {type: integer, minimum: 0, description: 'USAGE only: watched seconds that came out of the day''s base (deltaSec is the part that came out of earned time)'}
    Balance:
      type: object
      required: [balanceSec, entry]
      properties:
        balanceSec: {type: integer}
        entry: {$ref: '#/components/schemas/LedgerEntry'}
    CharacterVoice:
      type: string
      enum: [Puck, Zephyr, Fenrir, Leda, Aoede, Laomedeia, Achird, Sadachbia, Autonoe, Algenib, Achernar, Vindemiatrix]
      description: 'Gemini-TTS voices (Google Cloud Text-to-Speech), picked by the art director to suit the character: Puck upbeat, Zephyr bright, Fenrir excitable, Leda youthful, Aoede breezy, Laomedeia upbeat, Achird friendly, Sadachbia lively, Autonoe bright, Algenib gravelly, Achernar soft, Vindemiatrix gentle'
    CharacterMood: {type: string, enum: [happy, silly, brave, sleepy, proud, curious, calm]}
    CharacterVoiceStyle:
      type: object
      required: [pitch, pace, energy, texture]
      description: How the character sounds, picked by the art director to fit it (a tiny dragon squeaks and bounces, a sleepy bear rumbles slowly). Fixed words only, so the kid's idea never reaches the speech model as instructions.
      properties:
        pitch: {type: string, enum: [high, medium, low]}
        pace: {type: string, enum: [quick, normal, slow]}
        energy: {type: string, enum: [bouncy, cheerful, calm, sleepy, bold]}
        texture: {type: string, enum: [squeaky, clear, soft, breathy, gravelly, booming]}
    CharacterPart: {type: string, enum: [body, head, eye-left, eye-right, mouth, arm-left, arm-right, legs, extra]}
    Character:
      type: object
      required: [id, childId, status, description, createdAt]
      properties:
        id: {type: string}
        childId: {type: string}
        status:
          type: string
          enum: [drawing, ready, needs_help]
          description: 'needs_help: drawing and checking did not succeed within their repair rounds; the token went back to the kid, a grown-up can try other words'
        description: {type: string, description: 'the kid''s words'}
        name: {type: string, maxLength: 24, description: 'from the art director, in the family''s language, e.g. "Pancake Dragon" or "Pannkoogidraakon"'}
        card: {$ref: '#/components/schemas/CharacterCard'}
        voice: {$ref: '#/components/schemas/CharacterVoice'}
        voiceStyle: {$ref: '#/components/schemas/CharacterVoiceStyle'}
        svg: {type: string, description: 'the full, checked SVG (ready only), for the parent app to show'}
        createdAt: {type: integer}
        readyAt: {type: integer}
    CharacterCard:
      type: object
      description: The art director's reading of the kid's words; this, never the raw words, is what gets drawn.
      required: [what, colours, outfit, mood, detail]
      properties:
        what: {type: string, maxLength: 40, description: 'e.g. "a dragon"'}
        colours: {type: array, items: {type: string, maxLength: 16}, maxItems: 3}
        outfit: {type: string, maxLength: 60}
        mood: {$ref: '#/components/schemas/CharacterMood'}
        detail: {type: string, maxLength: 60, description: 'one fun detail, e.g. "loves pancakes, wears rollerskates"'}
    CharacterArt:
      type: object
      required: [id, viewBox, layers, voice]
      properties:
        id: {type: string}
        name: {type: string}
        voice: {$ref: '#/components/schemas/CharacterVoice'}
        viewBox: {type: string, example: 0 0 512 512}
        layers:
          type: array
          description: In drawing order. Each layer is a complete small SVG (same viewBox); a named part can be rotated or scaled around its pivot, a layer without a part never moves on its own.
          items:
            type: object
            required: [svg]
            properties:
              part: {$ref: '#/components/schemas/CharacterPart'}
              parent: {$ref: '#/components/schemas/CharacterPart', description: 'the named part this layer was drawn inside and rides on (eyes and mouth on the head, a held thing on an arm): the TV moves it with that part first'}
              pivot: {type: array, items: {type: number}, minItems: 2, maxItems: 2, description: '[x, y] in viewBox units'}
              svg: {type: string}
    Speech:
      type: object
      required: [audioUrl, durationMs, mouth]
      properties:
        audioUrl: {type: string, description: 'https URL of the audio (WAV, 24 kHz mono 16-bit), valid for at least a day'}
        durationMs: {type: integer}
        mouth:
          type: object
          required: [stepMs, open]
          description: How open the mouth is, every stepMs from the start (0 shut … 1 wide open), from the audio's loudness
          properties:
            stepMs: {type: integer, minimum: 10, maximum: 100}
            open: {type: array, items: {type: number, minimum: 0, maximum: 1}}
        visemes:
          type: array
          description: Viseme marks, when the voice gives them (none of the Gemini voices does)
          items: {type: object, required: [time, value], properties: {time: {type: integer, description: ms from the start}, value: {type: string}}}
    Handoff:
      type: object
      required: [pendingMinutes, entries]
      properties:
        pendingMinutes: {type: integer, description: 'pending earned minutes minus outstanding penalty debt, never below 0'}
        entries: {type: array, items: {$ref: '#/components/schemas/LedgerEntry'}, description: PENDING entries}

    Device:
      type: object
      required: [id, name, platform, mode, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        platform: {$ref: '#/components/schemas/Platform'}
        mode: {$ref: '#/components/schemas/DeviceMode'}
        lastSeen: {type: integer}
        createdAt: {type: integer}

    DeviceState:
      type: object
      description: Small on purpose; the TV replaces its local copy with it (claims it has not uploaded yet stay local).
      required: [family, device, children, chores, claims, adjustments, today, serverTime]
      properties:
        family:
          type: object
          required: [id, name, lang, caps, voice, pin]
          properties:
            id: {type: string}
            name: {type: string}
            lang: {$ref: '#/components/schemas/Lang'}
            caps: {type: boolean}
            voice: {type: boolean}
            pin:
              description: so the TV can check the grown-ups PIN offline; hash = hex(sha256(salt + ":" + pin))
              oneOf:
                - {type: 'null'}
                - {type: object, required: [salt, hash], properties: {salt: {type: string}, hash: {type: string}}}
        device:
          type: object
          required: [id, name, mode]
          properties:
            id: {type: string}
            name: {type: string}
            mode: {$ref: '#/components/schemas/DeviceMode'}
        children: {type: array, items: {$ref: '#/components/schemas/Child'}}
        chores: {type: array, items: {$ref: '#/components/schemas/Chore'}, description: only jobs assigned to someone}
        adjustments:
          type: array
          description: bonuses and taken-away minutes from the last 7 days, newest first, so the TV can say why a jar changed
          items:
            type: object
            required: [id, childId, deltaMin, reason, at]
            properties:
              id: {type: string, description: the ledger entry id}
              childId: {type: string}
              deltaMin: {type: integer, description: 'positive = bonus, negative = taken away (what was actually taken)'}
              reason: {type: string}
              at: {type: integer}
        claims: {type: array, items: {$ref: '#/components/schemas/Claim'}, description: 'waiting, plus decided in the last 7 days'}
        characters:
          type: array
          description: the kids' characters that are drawing or ready (art from GET /device/characters/{id})
          items:
            type: object
            required: [id, childId, status, createdAt]
            properties:
              id: {type: string}
              childId: {type: string}
              status: {type: string, enum: [drawing, ready]}
              name: {type: string}
              voice: {$ref: '#/components/schemas/CharacterVoice'}
              mood: {$ref: '#/components/schemas/CharacterMood'}
              createdAt: {type: integer}
        today: {type: string, description: 'the family''s local date, YYYY-MM-DD'}
        realtimeUrl: {type: string, description: 'wss:// address for live updates (x-realtime); absent where there is none'}
        serverTime: {type: integer}

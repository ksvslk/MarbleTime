<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for reused shapes -->
  <defs>
    <ellipse id="syrup-drip" rx="3" ry="7" fill="#8D4004"/>
  </defs>

  <!-- extra: Big fluffy Fox Tail (behind body) -->
  <g id="extra" data-pivot="190 380">
    <!-- Tail path -->
    <path d="M 190 390 C 130 400 60 360 70 270 C 75 210 130 190 155 210 C 170 220 180 250 160 290 C 175 270 200 280 205 320 C 210 360 205 385 190 390 Z" fill="#F05A28"/>
    <!-- Tail white tip -->
    <path d="M 70 270 C 75 210 130 190 155 210 C 158 212 159 217 157 222 C 145 225 130 220 125 235 C 120 250 100 255 95 265 C 90 275 80 272 70 270 Z" fill="#FFFFFF"/>
  </g>

  <!-- legs: Fox feet sitting/standing happily -->
  <g id="legs" data-pivot="256 420">
    <!-- Left foot -->
    <ellipse cx="205" cy="445" rx="30" ry="16" fill="#2C221E"/>
    <ellipse cx="205" cy="442" rx="20" ry="9" fill="#F05A28"/>
    <!-- Right foot -->
    <ellipse cx="307" cy="445" rx="30" ry="16" fill="#2C221E"/>
    <ellipse cx="307" cy="442" rx="20" ry="9" fill="#F05A28"/>
    <!-- Little toes details -->
    <circle cx="190" cy="446" r="4" fill="#FFFFFF"/>
    <circle cx="205" cy="448" r="4" fill="#FFFFFF"/>
    <circle cx="220" cy="446" r="4" fill="#FFFFFF"/>
    <circle cx="292" cy="446" r="4" fill="#FFFFFF"/>
    <circle cx="307" cy="448" r="4" fill="#FFFFFF"/>
    <circle cx="322" cy="446" r="4" fill="#FFFFFF"/>
  </g>

  <!-- body: Chubby fox body with round tummy bib/patch -->
  <g id="body" data-pivot="256 340">
    <!-- Main torso -->
    <path d="M 195 250 C 170 300 170 410 200 430 C 230 445 282 445 312 430 C 342 410 342 300 317 250 C 295 235 215 235 195 250 Z" fill="#F05A28"/>
    <!-- White fluffy chest / tummy -->
    <path d="M 220 250 C 200 300 205 380 225 415 C 240 425 272 425 287 415 C 307 380 312 300 292 250 C 275 265 235 265 220 250 Z" fill="#FFFFFF"/>
  </g>

  <!-- arm-left: Holding a golden fork ready to eat -->
  <g id="arm-left" data-pivot="190 280">
    <path d="M 195 275 C 160 285 140 320 155 350 C 165 365 185 350 185 335 C 175 315 185 295 205 285 Z" fill="#F05A28"/>
    <!-- Paw -->
    <circle cx="160" cy="345" r="15" fill="#2C221E"/>
    <!-- Fork handle -->
    <rect x="156" y="300" width="7" height="65" rx="3" fill="#D3D3D3" transform="rotate(15 160 345)"/>
    <!-- Fork head -->
    <path d="M 168 295 L 182 299 L 178 315 C 172 313 170 310 168 295 Z" fill="#D3D3D3"/>
    <line x1="171" y1="294" x2="167" y2="307" stroke="#A9A9A9" stroke-width="1.5"/>
    <line x1="176" y1="295" x2="172" y2="309" stroke="#A9A9A9" stroke-width="1.5"/>
    <line x1="181" y1="297" x2="177" y2="311" stroke="#A9A9A9" stroke-width="1.5"/>
  </g>

  <!-- arm-right: Holding high a delicious stack of syrup pancakes -->
  <g id="arm-right" data-pivot="320 280">
    <!-- Arm -->
    <path d="M 315 275 C 345 280 375 305 365 340 C 355 355 340 345 335 330 C 330 310 325 295 305 285 Z" fill="#F05A28"/>
    <!-- Paw -->
    <circle cx="355" cy="340" r="15" fill="#2C221E"/>
    
    <!-- Pancake Plate -->
    <ellipse cx="360" cy="345" rx="48" ry="14" fill="#FFFFFF"/>
    <ellipse cx="360" cy="345" rx="44" ry="11" fill="#DDF3F5"/>

    <!-- Pancake 1 (Bottom) -->
    <ellipse cx="360" cy="336" rx="36" ry="10" fill="#E59B4C"/>
    <ellipse cx="360" cy="334" rx="36" ry="9" fill="#F7C06D"/>

    <!-- Pancake 2 (Middle) -->
    <ellipse cx="360" cy="325" rx="34" ry="9" fill="#E59B4C"/>
    <ellipse cx="360" cy="323" rx="34" ry="8" fill="#F7C06D"/>

    <!-- Pancake 3 (Top) -->
    <ellipse cx="360" cy="314" rx="31" ry="8" fill="#E59B4C"/>
    <ellipse cx="360" cy="312" rx="31" ry="7.5" fill="#F7C06D"/>

    <!-- Sweet Maple Syrup Drips -->
    <path d="M 340 314 Q 343 328 346 322 Q 352 333 358 322 Q 368 335 373 320 Q 380 328 385 316 C 380 310 345 310 340 314 Z" fill="#8D4004"/>
    <circle cx="346" cy="326" r="2.5" fill="#8D4004"/>
    <circle cx="369" cy="334" r="2" fill="#8D4004"/>

    <!-- Butter Melting on Top -->
    <rect x="353" y="303" width="14" height="9" rx="2" fill="#FFF066" transform="rotate(-6 360 307)"/>
    <!-- Butter shine -->
    <rect x="355" y="304" width="4" height="3" rx="1" fill="#FFFFFF" transform="rotate(-6 360 307)"/>
  </g>

  <!-- head: Happy friendly fox head with big cute ears -->
  <g id="head" data-pivot="256 220">
    <!-- Left Ear -->
    <path d="M 195 170 L 150 75 C 175 60 215 90 225 135 Z" fill="#F05A28"/>
    <path d="M 190 155 L 163 88 C 178 80 198 100 208 132 Z" fill="#2C221E"/>

    <!-- Right Ear -->
    <path d="M 317 170 L 362 75 C 337 60 297 90 287 135 Z" fill="#F05A28"/>
    <path d="M 322 155 L 349 88 C 334 80 314 100 304 132 Z" fill="#2C221E"/>

    <!-- Main Face Shape -->
    <ellipse cx="256" cy="185" rx="72" ry="58" fill="#F05A28"/>
    <!-- Cheek fluff left & right -->
    <path d="M 184 185 C 160 195 155 225 180 235 C 195 240 215 235 225 230 Z" fill="#F05A28"/>
    <path d="M 328 185 C 352 195 357 225 332 235 C 317 240 297 235 287 230 Z" fill="#F05A28"/>

    <!-- White Snout / Cheeks -->
    <path d="M 180 230 C 165 215 175 190 205 185 C 230 180 245 200 256 215 C 267 200 282 180 307 185 C 337 190 347 215 332 230 C 300 255 270 255 256 250 C 242 255 212 255 180 230 Z" fill="#FFFFFF"/>

    <!-- Cute Pancake Chef Hat / Butter hair clip -->
    <ellipse cx="256" cy="130" rx="38" ry="10" fill="#FFF066"/>
    <ellipse cx="256" cy="126" rx="30" ry="8" fill="#FFFFFF"/>

    <!-- Soft Cheek Blush -->
    <circle cx="205" cy="216" r="10" fill="#FFA590" opacity="0.7"/>
    <circle cx="307" cy="216" r="10" fill="#FFA590" opacity="0.7"/>

    <!-- Little Black Fox Nose -->
    <path d="M 248 215 C 248 210 264 210 264 215 C 264 221 258 225 256 225 C 254 225 248 221 248 215 Z" fill="#2C221E"/>
  </g>

  <!-- eye-left: Joyful, lively big cartoon eye -->
  <g id="eye-left" data-pivot="224 180">
    <ellipse cx="224" cy="180" rx="14" ry="16" fill="#2C221E"/>
    <!-- Catchlights for ultra-cuteness -->
    <circle cx="221" cy="174" r="5" fill="#FFFFFF"/>
    <circle cx="228" cy="184" r="2.5" fill="#FFFFFF"/>
    <!-- Playful Eyebrow -->
    <path d="M 213 158 Q 225 152 237 159" stroke="#2C221E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- eye-right: Joyful winking/happy curved eye -->
  <g id="eye-right" data-pivot="288 180">
    <ellipse cx="288" cy="180" rx="14" ry="16" fill="#2C221E"/>
    <!-- Catchlights -->
    <circle cx="285" cy="174" r="5" fill="#FFFFFF"/>
    <circle cx="292" cy="184" r="2.5" fill="#FFFFFF"/>
    <!-- Playful Eyebrow -->
    <path d="M 275 159 Q 287 152 299 158" stroke="#2C221E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- mouth: Happy open smiling mouth licking lips for pancakes -->
  <g id="mouth" data-pivot="256 230">
    <!-- Open wide smile -->
    <path d="M 242 228 C 242 245 270 245 270 228 C 262 233 250 233 242 228 Z" fill="#8D4004"/>
    <!-- Rosy tongue -->
    <path d="M 250 235 C 252 243 264 243 266 234 C 260 233 254 233 250 235 Z" fill="#FF7575"/>
    <!-- Cheerful lip corner marks -->
    <path d="M 239 227 Q 242 230 245 229" stroke="#2C221E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 273 227 Q 270 230 267 229" stroke="#2C221E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Little drop of pancake syrup on cheek -->
    <use href="#syrup-drip" x="270" y="234" transform="rotate(-20 270 234)"/>
  </g>
</svg>
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.marbletime'
version = '0.1.0'

android {
  namespace "app.marbletime.strict"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // StrictEngine is plain Kotlin: its rules are tested on the JVM (./gradlew :marble-strict:testReleaseUnitTest).
  testImplementation 'junit:junit:4.13.2'
}

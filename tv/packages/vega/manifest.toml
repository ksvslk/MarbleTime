schema-version = 1

[package]
title = "MarbleTime"
version = "0.1.0"
id = "app.marbletime.tv"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "app.marbletime.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.lottie_3@ILottie_0"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[wants]
# Brief low-latency sounds (SoundPlayer/SystemSound), incl. the system's click on OK.
[[wants.service]]
id = "com.amazon.audio.system"

# Audio focus and volume (AudioManager/AudioFocus), which the system click also asks for.
[[wants.service]]
id = "com.amazon.audio.control"
